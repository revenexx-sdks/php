# The quality gate of this SDK, on every pull request. Packagist publishes
# from the release tag, which the generator creates only after the same checks
# passed on its side.
#
# This file is generated by revenexx/sdk-generator from
# templates/php/.github/workflows/ci.yml; change it there.
name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (format · types · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, json
          tools: composer

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Format
        run: composer format:check

      - name: Types
        run: composer phpstan

      - name: Test
        run: composer test
